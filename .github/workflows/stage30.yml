name: Stage68 2024 forward hydroperiod validation
on:
  push:
    branches: [chatgpt-stage30-20260826]
  workflow_dispatch:
jobs:
  stage68:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas mpmath
      - name: Run Stage68 2024 forward hydroperiod validation
        run: python stage68_2024_forward_hydroperiod_validation.py
      - name: Show summary
        run: cat stage68_outputs/stage68_summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: stage68-${{ matrix.os }}
          path: |
            stage68_outputs/
            stage68_2024_forward_hydroperiod_validation.py
            eghm_deterministic_kernel.py
            eghm_deterministic_forcing.py
            eghm_deterministic_geometry.py
            eghm_reproducibility_contract.py
          retention-days: 30
