name: Stage67 head-dependent seepage structural test
on:
  push:
    branches: [chatgpt-stage30-20260826]
  workflow_dispatch:
jobs:
  stage67:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        replica: [1, 2]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      REPLICA: ${{ matrix.replica }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas mpmath
      - name: Run Stage67 head-dependent seepage test
        run: python stage67_head_dependent_seepage_test.py
      - name: Show summary
        run: cat stage67_outputs/stage67_summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: stage67-${{ matrix.os }}-r${{ matrix.replica }}
          path: |
            stage67_outputs/
            stage67_head_dependent_seepage_test.py
            stage66_seasonal_dryness_forensics.py
            eghm_deterministic_scenarios.py
            eghm_deterministic_kernel.py
            eghm_deterministic_forcing.py
            eghm_deterministic_geometry.py
            eghm_deterministic_fit.py
            eghm_reproducibility_contract.py
          retention-days: 30
