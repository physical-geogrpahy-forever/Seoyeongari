name: Stage37 groundwater-loss hydro-ecology
on:
  push:
    branches: [chatgpt-stage30-20260826]
  workflow_dispatch:
jobs:
  run-stage37:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas
      - name: Run Stage 37
        run: python stage37_groundwater_loss.py
      - name: Show summary
        run: cat stage37_outputs/stage37_summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: stage37-results
          path: stage37_outputs/
          retention-days: 30
