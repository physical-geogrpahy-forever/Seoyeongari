name: Stage35D excluded-2022 holdout
on:
  push:
    branches: [chatgpt-stage30-20260826]
  workflow_dispatch:
jobs:
  holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas
      - name: Run locked Stage 35D holdout
        run: python stage35d_holdout_2022.py
      - name: Show summary
        run: cat stage35d_holdout_outputs/stage35d_holdout_2022.json
      - uses: actions/upload-artifact@v4
        with:
          name: stage35d-holdout-2022
          path: stage35d_holdout_outputs/
          retention-days: 30
