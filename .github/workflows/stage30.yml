name: Stage73 literature-bounded ecological rule search
on:
  push:
    branches: [chatgpt-stage30-20260826]
  workflow_dispatch:
jobs:
  stage73:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas mpmath
      - name: Run Stage73 literature-bounded ecological rule search
        run: python stage73_reference_ecological_rule_search.py
      - name: Show summary
        run: cat stage73_outputs/stage73_summary.json
      - name: Enforce data and physical contract only
        run: |
          python - <<'PY'
          import json, pathlib
          d=json.loads(pathlib.Path('stage73_outputs/stage73_summary.json').read_text())
          if d.get('status') != 'PASS_STAGE73_REFERENCE_BOUNDED_RULE_SEARCH':
              raise SystemExit('Stage73 failed')
          if d.get('pond_area_observation_2022') != 'ABSENT':
              raise SystemExit('2022 pond-area observation must remain absent')
          if d.get('hydrology_changed') is not False or d.get('peat_rate_changed') is not False:
              raise SystemExit('Stage73 must not change hydrology or peat rate')
          wb=d.get('physical_closure',{})
          if max(wb.values()) > 1e-8:
              raise SystemExit('physical closure failed')
          # Accuracy ranking and LOOCV are outputs only, not acceptance gates.
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage73-${{ matrix.os }}
          path: |
            stage73_outputs/
            stage73_reference_ecological_rule_search.py
            eghm_deterministic_scenarios.py
            eghm_deterministic_kernel.py
            eghm_deterministic_forcing.py
            eghm_deterministic_geometry.py
            EGHM_STRICT_MODEL_RULES.md
          retention-days: 30
