name: Stage77 peat-forming area feedback
on:
  push:
    branches: [chatgpt-stage30-20260826]
  workflow_dispatch:
jobs:
  stage77:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas mpmath
      - name: Run Stage77 peat-forming area feedback test
        run: python stage77_peat_forming_area_feedback.py
      - name: Show summary
        run: cat stage77_outputs/stage77_summary.json
      - name: Enforce data and physical contract only
        run: |
          python - <<'PY'
          import json, pathlib
          d=json.loads(pathlib.Path('stage77_outputs/stage77_summary.json').read_text())
          if d.get('status') != 'PASS_STAGE77_PEAT_FORMING_AREA_FEEDBACK_TEST': raise SystemExit('Stage77 failed')
          if d.get('pond_area_observation_2022') != 'ABSENT': raise SystemExit('2022 must remain absent')
          if d.get('local_wet_peat_rate_changed') is not False: raise SystemExit('local peat rate must remain fixed')
          if d.get('conserved_hydrology_changed') is not False: raise SystemExit('Stage77 must not alter conserved hydrology')
          if max(d.get('physical_closure',{}).values()) > 1e-8: raise SystemExit('closure failed')
          # Mode ranking and accuracy are scientific outputs only.
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage77-${{ matrix.os }}
          path: |
            stage77_outputs/
            stage77_peat_forming_area_feedback.py
            STAGE75_ET_FEEDBACK_DECISION_LOG.md
            STAGE73_74_ECO_RULE_DECISION_LOG.md
            eghm_deterministic_scenarios.py
            eghm_deterministic_kernel.py
            eghm_deterministic_forcing.py
            eghm_deterministic_geometry.py
          retention-days: 30
