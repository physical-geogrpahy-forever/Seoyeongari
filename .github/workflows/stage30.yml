name: Stage61b deterministic geometry forensics
on:
  push:
    branches: [chatgpt-stage30-20260826]
  workflow_dispatch:
jobs:
  stage61b:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        replica: [1, 2, 3, 4]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      REPLICA: ${{ matrix.replica }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas
      - name: Run Stage61b deterministic geometry forensics
        run: python stage61b_deterministic_geometry_forensics.py
      - name: Show summary
        run: cat stage61b_outputs/stage61b_summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: stage61b-${{ matrix.os }}-r${{ matrix.replica }}
          path: |
            stage61b_outputs/
            stage61b_deterministic_geometry_forensics.py
            eghm_deterministic_geometry.py
            stage38_domain_corrected.py
          retention-days: 30
