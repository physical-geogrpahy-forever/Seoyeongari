name: Stage56 April-May metadata-aligned recalibration
on:
  push:
    branches: [chatgpt-stage30-20260826]
  workflow_dispatch:
jobs:
  run-stage56:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas
      - name: Run Stage56 April-May recalibration
        run: python stage56_aprmay_recalibration.py
      - name: Show Stage56 summary
        if: always()
        run: cat stage56_outputs/stage56_summary.json || true
      - name: Enforce unchanged Stage49 contract
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('stage56_outputs/stage56_summary.json')
          d=json.loads(p.read_text()) if p.exists() else {}
          if d.get('status') != 'PASS_SIX_OBSERVATION_CALIBRATION':
              raise SystemExit('Stage56 calibration did not produce a valid candidate')
          if d.get('pond_area_observation_2022') != 'ABSENT_NOT_HOLDOUT':
              raise SystemExit('2022 pond-area observation must remain absent')
          if d.get('evaluation_window_selected_by_fit') is not False:
              raise SystemExit('April-May window must be metadata-selected, not fit-selected')
          if d.get('parameter_grids_changed_from_stage49') is not False:
              raise SystemExit('Stage49 grids must remain unchanged')
          if d.get('physical_process_structure_changed_from_stage49') is not False:
              raise SystemExit('Stage49 process structure must remain unchanged')
          sel=d.get('selected') or {}
          if max(sel.get('max_mass_error_m3',1),sel.get('max_area_partition_error_m2',1),sel.get('max_precip_partition_error_m3',1)) > 1e-8:
              raise SystemExit('physical closure failed')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage56-aprmay-recalibration
          path: |
            stage56_outputs/
            stage56_aprmay_recalibration.py
            stage49_six_observation_irreversible_recruitment.py
            stage38_domain_corrected.py
            STAGE55_DECISION_LOG.md
            EGHM_REFERENCE_LEDGER_SUPPLEMENT_08.md
            EGHM_STRICT_MODEL_RULES.md
          if-no-files-found: warn
          retention-days: 30
