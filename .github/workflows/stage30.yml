name: Stage30 macro head drainage
on:
  push:
    branches: [chatgpt-stage30-20260826]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  run-stage30:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: pip install numpy pandas
      - name: Run optimized Stage 26 regression and Stage 30 screen
        run: python stage30_macro_head_drainage_fast.py
      - name: Show compact summary
        if: always()
        run: |
          if [ -f stage30_fast_outputs/stage30_fast_summary.json ]; then cat stage30_fast_outputs/stage30_fast_summary.json; fi
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage30-fast-results
          path: stage30_fast_outputs/
          retention-days: 30
