name: Stage58b exact central consistency audit
on:
  push:
    branches: [chatgpt-stage30-20260826]
  workflow_dispatch:
jobs:
  run-stage58b:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas
      - name: Run Stage58b consistency audit
        run: python stage58b_central_consistency_audit.py
      - name: Show Stage58b summary
        if: always()
        run: cat stage58b_outputs/stage58b_summary.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage58b-central-consistency
          path: |
            stage58b_outputs/
            stage58b_central_consistency_audit.py
            stage58_aprmay_oat_provenance.py
            stage57_aprmay_four_scenario_peat.py
          if-no-files-found: warn
          retention-days: 30
