name: Stage64 official deterministic OAT
on:
  push:
    branches: [chatgpt-stage30-20260826]
  workflow_dispatch:
jobs:
  stage64:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        replica: [1, 2]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      REPLICA: ${{ matrix.replica }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas mpmath
      - name: Run Stage64 deterministic OAT
        run: python stage64_official_deterministic_oat.py
      - name: Show summary
        run: cat stage64_outputs/stage64_summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: stage64-${{ matrix.os }}-r${{ matrix.replica }}
          path: |
            stage64_outputs/
            stage64_official_deterministic_oat.py
            eghm_deterministic_scenarios.py
            eghm_deterministic_kernel.py
            eghm_deterministic_forcing.py
            eghm_deterministic_geometry.py
            eghm_deterministic_fit.py
            eghm_reproducibility_contract.py
          retention-days: 30
