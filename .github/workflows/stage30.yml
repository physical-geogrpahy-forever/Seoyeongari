name: Stage35D flood reversal identifiability
on:
  push:
    branches: [chatgpt-stage30-20260826]
  workflow_dispatch:
jobs:
  run-stage35d:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas
      - name: Run Stage 35D
        run: python stage35d_flood_reversal.py
      - name: Show summary
        run: cat stage35d_outputs/stage35d_summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: stage35d-results
          path: stage35d_outputs/
          retention-days: 30
