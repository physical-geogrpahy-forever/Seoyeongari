name: Stage61c scalar recurrence forensics
on:
  push:
    branches: [chatgpt-stage30-20260826]
  workflow_dispatch:
jobs:
  stage61c:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        replica: [1, 2, 3, 4]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      REPLICA: ${{ matrix.replica }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas
      - name: Run Stage61c scalar recurrence forensics
        run: python stage61c_scalar_recurrence_forensics.py
      - name: Show summary
        run: cat stage61c_outputs/stage61c_summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: stage61c-${{ matrix.os }}-r${{ matrix.replica }}
          path: |
            stage61c_outputs/
            stage61c_scalar_recurrence_forensics.py
            eghm_deterministic_geometry.py
          retention-days: 30
