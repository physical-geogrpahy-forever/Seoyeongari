name: Stage59 cross-runner numerical determinism audit
on:
  push:
    branches: [chatgpt-stage30-20260826]
  workflow_dispatch:
jobs:
  stage59:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas
      - name: Run Stage59 numerical audit
        run: python stage59_cross_runner_numerics_audit.py
      - name: Show Stage59 summary
        run: cat stage59_outputs/stage59_summary.json
      - name: Physical contract
        run: |
          python - <<'PY'
          import json, pathlib
          d=json.loads(pathlib.Path('stage59_outputs/stage59_summary.json').read_text())
          if d.get('status')!='PASS_STAGE59_NUMERICS_AUDIT': raise SystemExit('audit failed')
          if max(d['physical_closure'].values())>1e-8: raise SystemExit('closure failed')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage59-${{ matrix.os }}
          path: |
            stage59_outputs/
            stage59_cross_runner_numerics_audit.py
            stage57_aprmay_four_scenario_peat.py
            stage58_aprmay_oat_provenance.py
          retention-days: 30
