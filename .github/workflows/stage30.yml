name: Stage31C hydroperiod-state calibration
on:
  push:
    branches: [chatgpt-stage30-20260826]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  run-stage31c:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: pip install numpy pandas
      - name: Run Stage 31C hydroperiod-state screen
        run: python stage31c_exposure_state.py
      - name: Show compact summary
        if: always()
        run: |
          if [ -f stage31c_outputs/stage31c_summary.json ]; then cat stage31c_outputs/stage31c_summary.json; fi
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage31c-results
          path: stage31c_outputs/
          retention-days: 30
