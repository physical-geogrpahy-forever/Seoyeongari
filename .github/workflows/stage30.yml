name: Stage35F storage-area coupled hydro-ecology
on:
  push:
    branches: [chatgpt-stage30-20260826]
  workflow_dispatch:
jobs:
  run-stage35f:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas
      - name: Run Stage 35F
        run: python stage35f_storage_area_coupling.py
      - name: Show summary
        run: cat stage35f_outputs/stage35f_summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: stage35f-results
          path: stage35f_outputs/
          retention-days: 30
