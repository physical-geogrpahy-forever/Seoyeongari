name: Stage31E exposure-runoff model
on:
  push:
    branches: [chatgpt-stage30-20260826]
  workflow_dispatch:
jobs:
  run-stage31e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: pip install numpy pandas
      - name: Run Stage 31E exposure-runoff calibration
        run: python stage31e_exposure_runoff.py
      - name: Show compact summary
        if: always()
        run: |
          if [ -f stage31e_outputs/summary.json ]; then cat stage31e_outputs/summary.json; fi
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage31e-results
          path: stage31e_outputs/
          retention-days: 30
