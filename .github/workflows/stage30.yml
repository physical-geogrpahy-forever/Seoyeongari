name: Stage63 official deterministic four-scenario peat
on:
  push:
    branches: [chatgpt-stage30-20260826]
  workflow_dispatch:
jobs:
  stage63:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        replica: [1, 2]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      REPLICA: ${{ matrix.replica }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas mpmath
      - name: Run Stage63 deterministic four-scenario peat analysis
        run: python stage63_official_deterministic_four_scenario_peat.py
      - name: Show summary
        run: cat stage63_outputs/stage63_summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: stage63-${{ matrix.os }}-r${{ matrix.replica }}
          path: |
            stage63_outputs/
            stage63_official_deterministic_four_scenario_peat.py
            eghm_deterministic_scenarios.py
            eghm_deterministic_kernel.py
            eghm_deterministic_forcing.py
            eghm_deterministic_geometry.py
            eghm_deterministic_fit.py
            eghm_reproducibility_contract.py
          retention-days: 30
