name: Stage65 hydroperiod process diagnosis
on:
  push:
    branches: [chatgpt-stage30-20260826]
  workflow_dispatch:
jobs:
  stage65:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas mpmath
      - name: Run Stage65 hydroperiod process diagnosis
        run: python stage65_hydroperiod_process_diagnosis.py
      - name: Show summary
        run: cat stage65_outputs/stage65_summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: stage65-hydroperiod-process-diagnosis
          path: |
            stage65_outputs/
            stage65_hydroperiod_process_diagnosis.py
            stage64_official_deterministic_oat.py
            eghm_deterministic_scenarios.py
            eghm_deterministic_kernel.py
            eghm_deterministic_forcing.py
            eghm_deterministic_geometry.py
            eghm_deterministic_fit.py
            eghm_reproducibility_contract.py
          retention-days: 30
