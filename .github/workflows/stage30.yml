name: Stage60b feature determinism forensics
on:
  push:
    branches: [chatgpt-stage30-20260826]
  workflow_dispatch:
jobs:
  stage60b:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        replica: [1, 2]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      REPLICA: ${{ matrix.replica }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas
      - name: Run Stage60b feature forensics
        run: python stage60b_feature_determinism_forensics.py
      - name: Show summary
        run: cat stage60b_outputs/stage60b_summary.json
      - name: Enforce physical closure only
        run: |
          python - <<'PY'
          import json, pathlib
          d=json.loads(pathlib.Path('stage60b_outputs/stage60b_summary.json').read_text())
          if d.get('status')!='PASS_STAGE60B_FORENSICS': raise SystemExit('forensics failed')
          if max(d['physical_closure'].values())>1e-8: raise SystemExit('physical closure failed')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage60b-${{ matrix.os }}-r${{ matrix.replica }}
          path: |
            stage60b_outputs/
            stage60b_feature_determinism_forensics.py
            stage49_six_observation_irreversible_recruitment.py
            stage45_expanded_hydrology_nested.py
            stage38_domain_corrected.py
          retention-days: 30
