name: Stage34 reference-constrained hydro-ecology
on:
  push:
    branches: [chatgpt-stage30-20260826]
  workflow_dispatch:
jobs:
  run-stage34:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: pip install numpy pandas
      - name: Run Stage 34 reference-constrained model
        run: python stage34_reference_constrained.py
      - name: Show compact summary
        if: always()
        run: |
          if [ -f stage34_outputs/stage34_summary.json ]; then cat stage34_outputs/stage34_summary.json; fi
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage34-results
          path: stage34_outputs/
          retention-days: 30
