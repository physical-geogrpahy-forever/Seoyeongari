name: Stage35B exact water balance with Hayashi storage-area
on:
  push:
    branches: [chatgpt-stage30-20260826]
  workflow_dispatch:
jobs:
  run-stage35b:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: pip install numpy pandas
      - name: Run Stage 35B
        run: python stage35b_mass_balance_hayashi.py
      - name: Show compact summary
        if: always()
        run: |
          if [ -f stage35b_outputs/stage35b_summary.json ]; then cat stage35b_outputs/stage35b_summary.json; fi
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage35b-results
          path: stage35b_outputs/
          retention-days: 30
