name: Stage31C compact structural check
on:
  push:
    branches: [chatgpt-stage30-20260826]
  workflow_dispatch:
jobs:
  run-stage31c-mini:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: pip install numpy pandas
      - name: Run compact Stage 31C check
        run: python stage31c_mini.py
      - name: Show compact summary
        if: always()
        run: |
          if [ -f stage31c_mini_outputs/summary.json ]; then cat stage31c_mini_outputs/summary.json; fi
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage31c-mini-results
          path: stage31c_mini_outputs/
          retention-days: 30
