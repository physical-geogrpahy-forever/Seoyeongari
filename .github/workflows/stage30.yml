name: Stage69 observation semantics audit
on:
  push:
    branches: [chatgpt-stage30-20260826]
  workflow_dispatch:
jobs:
  stage69:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas mpmath
      - name: Run Stage69 observation semantics audit
        run: python stage69_observation_semantics_audit.py
      - name: Show summary
        run: cat stage69_outputs/stage69_summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: stage69-${{ matrix.os }}
          path: |
            stage69_outputs/
            stage69_observation_semantics_audit.py
            EGHM_STRICT_MODEL_RULES.md
            eghm_strict_rules.py
            eghm_deterministic_scenarios.py
            eghm_deterministic_kernel.py
            eghm_deterministic_forcing.py
            eghm_deterministic_geometry.py
            eghm_reproducibility_contract.py
          retention-days: 30
