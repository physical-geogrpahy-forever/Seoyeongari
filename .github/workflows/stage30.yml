name: Stage36 locked holdout and hydroperiod diagnostics
on:
  push:
    branches: [chatgpt-stage30-20260826]
  workflow_dispatch:
jobs:
  run-stage36-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas
      - name: Run locked Stage 36 holdout
        run: python stage36_holdout_2022.py
      - name: Show summary
        run: cat stage36_holdout_outputs/stage36_holdout_2022.json
      - uses: actions/upload-artifact@v4
        with:
          name: stage36-holdout-2022
          path: stage36_holdout_outputs/
          retention-days: 30
