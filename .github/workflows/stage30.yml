name: Stage36 hydroperiod-driven hydro-ecology
on:
  push:
    branches: [chatgpt-stage30-20260826]
  workflow_dispatch:
jobs:
  run-stage36:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas
      - name: Run Stage 36
        run: python stage36_hydroperiod_state.py
      - name: Show summary
        run: cat stage36_outputs/stage36_summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: stage36-results
          path: stage36_outputs/
          retention-days: 30
