name: Stage35C balanced excluded-2022 holdout
on:
  push:
    branches: [chatgpt-stage30-20260826]
  workflow_dispatch:
jobs:
  holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas
      - name: Run locked 2022 holdout
        run: python stage35c_balanced_holdout_2022.py
      - name: Show summary
        run: cat stage35c_holdout_outputs/stage35c_balanced_holdout_2022.json
      - uses: actions/upload-artifact@v4
        with:
          name: stage35c-balanced-holdout-2022
          path: stage35c_holdout_outputs/
          retention-days: 30
