name: Stage34 excluded-2022 holdout
on:
  push:
    branches: [chatgpt-stage30-20260826]
  workflow_dispatch:
jobs:
  run-stage34-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: pip install numpy pandas
      - name: Run locked Stage 34 holdout
        run: python stage34_holdout_2022.py
      - name: Show holdout summary
        if: always()
        run: |
          if [ -f stage34_holdout_outputs/stage34_holdout_2022.json ]; then cat stage34_holdout_outputs/stage34_holdout_2022.json; fi
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage34-holdout-2022
          path: stage34_holdout_outputs/
          retention-days: 30
