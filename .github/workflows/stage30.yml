name: Stage31B accuracy-first calibration
on:
  push:
    branches: [chatgpt-stage30-20260826]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  run-stage31b:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: pip install numpy pandas
      - name: Run Stage 31B accuracy-first screen
        run: python stage31b_accuracy_first.py
      - name: Show compact summary
        if: always()
        run: |
          if [ -f stage31b_outputs/stage31b_summary.json ]; then cat stage31b_outputs/stage31b_summary.json; fi
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage31b-results
          path: stage31b_outputs/
          retention-days: 30
