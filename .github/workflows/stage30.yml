name: Stage35A mass-balance-first hydro-ecology
on:
  push:
    branches: [chatgpt-stage30-20260826]
  workflow_dispatch:
jobs:
  run-stage35a:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: pip install numpy pandas
      - name: Run Stage 35A mass-balance-first calibration
        run: python stage35a_mass_balance_hydroeco.py
      - name: Show compact summary
        if: always()
        run: |
          if [ -f stage35a_outputs/stage35a_summary.json ]; then cat stage35a_outputs/stage35a_summary.json; fi
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage35a-results
          path: stage35a_outputs/
          retention-days: 30
