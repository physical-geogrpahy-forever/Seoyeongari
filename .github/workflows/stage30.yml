name: Stage51 persistent peat sensitivity
on:
  push:
    branches: [chatgpt-stage30-20260826]
  workflow_dispatch:
jobs:
  run-stage51:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas
      - name: Run Stage51 persistent net peat accretion sensitivity
        run: python stage51_persistent_peat_sensitivity.py
      - name: Show Stage51 summary
        if: always()
        run: cat stage51_outputs/stage51_summary.json || true
      - name: Enforce physical/data contract only
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('stage51_outputs/stage51_summary.json')
          d=json.loads(p.read_text()) if p.exists() else {}
          if d.get('status') != 'PASS_STAGE51_ANALYSIS':
              raise SystemExit('Stage51 analysis failed')
          if d.get('pond_area_observation_2022') != 'ABSENT':
              raise SystemExit('2022 pond-area observation must be absent')
          wb=d.get('water_balance',{})
          if max(wb.values()) > 1e-8:
              raise SystemExit('physical closure failed')
          # Scenario rank is deliberately NOT an acceptance condition.
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage51-persistent-peat-sensitivity
          path: |
            stage51_outputs/
            stage51_persistent_peat_sensitivity.py
            stage50_four_scenario_peat_sensitivity.py
            EGHM_STRICT_MODEL_RULES.md
          if-no-files-found: warn
          retention-days: 30
