name: Stage31 TOPMODEL VSA
on:
  push:
    branches: [chatgpt-stage30-20260826]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  run-stage31:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: pip install numpy pandas
      - name: Run Stage 31 VSA screen
        run: python stage31_topmodel_vsa.py
      - name: Show compact summary
        if: always()
        run: |
          if [ -f stage31_outputs/stage31_summary.json ]; then cat stage31_outputs/stage31_summary.json; fi
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage31-results
          path: stage31_outputs/
          retention-days: 30
