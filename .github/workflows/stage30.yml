name: Stage66 seasonal dryness forensics
on:
  push:
    branches: [chatgpt-stage30-20260826]
  workflow_dispatch:
jobs:
  stage66:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas mpmath
      - name: Run Stage66 seasonal dryness forensics
        run: python stage66_seasonal_dryness_forensics.py
      - name: Show summary
        run: cat stage66_outputs/stage66_summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: stage66-seasonal-dryness-forensics
          path: |
            stage66_outputs/
            stage66_seasonal_dryness_forensics.py
            stage65_hydroperiod_process_diagnosis.py
            eghm_deterministic_kernel.py
            eghm_deterministic_forcing.py
            eghm_deterministic_geometry.py
          retention-days: 30
