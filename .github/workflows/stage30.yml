name: Stage60c full-build state forensics
on:
  push:
    branches: [chatgpt-stage30-20260826]
  workflow_dispatch:
jobs:
  stage60c:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        replica: [1, 2]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      REPLICA: ${{ matrix.replica }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas
      - name: Run Stage60c full-build forensics
        run: python stage60c_full_build_state_forensics.py
      - name: Show summary
        run: cat stage60c_outputs/stage60c_summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: stage60c-${{ matrix.os }}-r${{ matrix.replica }}
          path: |
            stage60c_outputs/
            stage60c_full_build_state_forensics.py
            stage49_six_observation_irreversible_recruitment.py
            stage56_aprmay_recalibration.py
          retention-days: 30
