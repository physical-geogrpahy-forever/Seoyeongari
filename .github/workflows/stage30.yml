name: Stage71 observation contract freeze
on:
  push:
    branches: [chatgpt-stage30-20260826]
  workflow_dispatch:
jobs:
  stage71:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas mpmath
      - name: Run Stage71 observation contract freeze
        run: python stage71_observation_contract_freeze.py
      - name: Show summary
        run: cat stage71_outputs/stage71_summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: stage71-${{ matrix.os }}
          path: |
            stage71_outputs/
            stage71_observation_contract_freeze.py
            stage63_official_deterministic_four_scenario_peat.py
            stage68_2024_forward_hydroperiod_validation.py
            stage69_observation_semantics_audit.py
            EGHM_STRICT_MODEL_RULES.md
            eghm_strict_rules.py
            eghm_deterministic_scenarios.py
            eghm_deterministic_kernel.py
            eghm_deterministic_forcing.py
            eghm_deterministic_geometry.py
            eghm_reproducibility_contract.py
          retention-days: 30
