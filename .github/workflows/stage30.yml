name: Stage39 nested strict validation
on:
  push:
    branches: [chatgpt-stage30-20260826]
  workflow_dispatch:
jobs:
  run-stage39:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas
      - name: Run nested strict Stage 39
        id: nested
        continue-on-error: true
        run: python stage39_nested_selection.py
      - name: Show nested summary
        if: always()
        run: cat stage39_outputs/stage39_summary.json || true
      - name: Explain any rejected candidates without changing rules
        if: always()
        run: python stage39_diagnose.py
      - name: Enforce nested gate
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib, sys
          p=pathlib.Path('stage39_outputs/stage39_summary.json')
          d=json.loads(p.read_text()) if p.exists() else {}
          if not d.get('nested_selection_pass',False):
              raise SystemExit('Stage39 nested gate failed; 2022 remains sealed')
          PY
      - name: Run 2022 holdout only after nested pass
        run: python stage39_holdout_2022.py
      - name: Show holdout summary
        run: cat stage39_holdout_outputs/stage39_holdout_2022.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage39-nested-results
          path: |
            stage39_outputs/
            stage39_holdout_outputs/
            EGHM_STRICT_MODEL_RULES.md
          if-no-files-found: warn
          retention-days: 30
